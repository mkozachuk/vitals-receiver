name: ci

# The suite, on every push and on every pull request into main. No secrets:
# the tests run against an in-memory database and the servers' inject(), so
# the only network this job needs is the npm registry.
# Typecheck (tsc --noEmit) runs before the suite so type errors fail fast.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
