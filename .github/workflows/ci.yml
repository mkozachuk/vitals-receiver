name: ci

# The suite, on every push and on every pull request into main. No secrets:
# the tests run against an in-memory database and the servers' inject(), so
# the only network this job needs is the npm registry.
# Typecheck (tsc --noEmit) runs before the suite so type errors fail fast.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # NB-775: the per-user scheduled task on a real Windows host, end to end, with
  # the README's "Windows" commands in the same order. The unit tests check the
  # .ps1 files as text; this job is where Windows PowerShell runs them. Install
  # starts the task itself (Start-ScheduledTask): no logon happens on a runner.
  windows-service:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # Golden fixtures are compared byte for byte: keep LF as committed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: deps
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The service steps run even when the suite is red, so one run shows both.
      - name: seed the store from the demo
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run demo -- --no-serve
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\vitals" | Out-Null
          Copy-Item (Join-Path ([System.IO.Path]::GetTempPath()) 'vitals-demo\demo.db') "$env:LOCALAPPDATA\vitals\vitals.db"
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run token:mint
      # NB-842 B1: Task Scheduler's own history is off by default; the
      # diagnostics below read it.
      - name: task scheduler history on
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        run: wevtutil set-log Microsoft-Windows-TaskScheduler/Operational /enabled:true
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run service:install
      # NB-842 B1: what Task Scheduler holds and did. Read-only; never decides
      # the job (continue-on-error), the verify and delivery steps do.
      - name: task diagnostics after install
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        run: |
          $t = Get-ScheduledTask -TaskName vitals -ErrorAction SilentlyContinue
          if (-not $t) { 'no scheduled task vitals' } else {
            'state: ' + $t.State
            $t.Actions | Format-List Execute, Arguments, WorkingDirectory
            $t.Principal | Format-List UserId, LogonType, RunLevel
            $t.Triggers | Format-List *
            Export-ScheduledTask -TaskName vitals
            $i = Get-ScheduledTaskInfo -TaskName vitals
            'LastTaskResult: {0} (0x{1:X8})' -f $i.LastTaskResult, [uint32]$i.LastTaskResult
            'LastRunTime: ' + $i.LastRunTime + '   NumberOfMissedRuns: ' + $i.NumberOfMissedRuns
          }
          'whoami: ' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name + '   session: ' + (Get-Process -Id $PID).SessionId
          query user 2>&1 | Out-String
          Get-WinEvent -LogName Microsoft-Windows-TaskScheduler/Operational -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'vitals' } | Format-List TimeCreated, Id, Message
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe' OR Name = 'powershell.exe'" |
            Format-List ProcessId, ParentProcessId, SessionId, CommandLine
          $log = "$env:LOCALAPPDATA\vitals\logs\vitals.log"
          if (Test-Path $log) { 'vitals.log:'; Get-Content -Tail 50 $log } else { 'no vitals.log' }
          # Where does the action die? Windows PowerShell 5.1 parses run.ps1, then
          # runs the task's own argument line with a node that does not exist
          # (nothing is served) and a scratch log; its stderr is printed.
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $run = Join-Path $PWD 'scripts\windows\run.ps1'
          & $ps -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$run', [ref]`$null, [ref]`$e); 'parse errors: ' + @(`$e).Count; `$e | ForEach-Object { [string]`$_.Extent.StartLineNumber + ': ' + `$_.Message }"
          'acl of the checkout, run.ps1 and node:'
          icacls $PWD
          icacls $run
          icacls (Split-Path -Parent (Get-Command node).Path)
          whoami /groups /fo csv | ConvertFrom-Csv | Format-Table 'Group Name', Attributes -AutoSize | Out-String -Width 200
          if ($t) {
            $probeLog = Join-Path $env:RUNNER_TEMP 'probe\vitals.log'
            $a = $t.Actions[0].Arguments -replace '-Node "[^"]*"', '-Node "C:\no-such-dir\node.exe"' -replace '-Log "[^"]*"', ('-Log "' + $probeLog + '"')
            $p = Start-Process -FilePath $t.Actions[0].Execute -ArgumentList $a -WorkingDirectory $t.Actions[0].WorkingDirectory -PassThru -NoNewWindow -RedirectStandardError "$env:RUNNER_TEMP\probe-err.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\probe-out.txt"
            if (-not $p.WaitForExit(6000)) { 'probe still running after 6 s (past the start)'; Stop-Process -Id $p.Id -Force } else { 'probe exited ' + $p.ExitCode }
            'probe stderr:'; Get-Content "$env:RUNNER_TEMP\probe-err.txt" -ErrorAction SilentlyContinue
            'probe stdout:'; Get-Content "$env:RUNNER_TEMP\probe-out.txt" -ErrorAction SilentlyContinue
            'probe log:'; Get-Content $probeLog -ErrorAction SilentlyContinue
          }
          Get-WinEvent -LogName 'Windows PowerShell' -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'run\.ps1' } | Select-Object -First 6 | Format-List TimeCreated, Id, Message
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run service:verify
      - name: first delivery
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          $token = (Get-Content -Raw "$env:LOCALAPPDATA\vitals\token").Trim()
          curl.exe -fsS -H "x-vitals-token: $token" -H 'content-type: application/json' --data-binary '@tests/fixtures/worked-example.json' http://127.0.0.1:4781/ingest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run deliveries
      - name: logs
        if: always()
        run: Get-Content -Tail 50 "$env:LOCALAPPDATA\vitals\logs\vitals.log" -ErrorAction SilentlyContinue
      # NB-842 B1: what Task Scheduler holds and did. Read-only; never decides
      # the job (continue-on-error), the verify and delivery steps do.
      - name: task diagnostics before uninstall
        if: always()
        continue-on-error: true
        run: |
          $t = Get-ScheduledTask -TaskName vitals -ErrorAction SilentlyContinue
          if (-not $t) { 'no scheduled task vitals' } else {
            'state: ' + $t.State
            $t.Actions | Format-List Execute, Arguments, WorkingDirectory
            $t.Principal | Format-List UserId, LogonType, RunLevel
            $t.Triggers | Format-List *
            Export-ScheduledTask -TaskName vitals
            $i = Get-ScheduledTaskInfo -TaskName vitals
            'LastTaskResult: {0} (0x{1:X8})' -f $i.LastTaskResult, [uint32]$i.LastTaskResult
            'LastRunTime: ' + $i.LastRunTime + '   NumberOfMissedRuns: ' + $i.NumberOfMissedRuns
          }
          'whoami: ' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name + '   session: ' + (Get-Process -Id $PID).SessionId
          query user 2>&1 | Out-String
          Get-WinEvent -LogName Microsoft-Windows-TaskScheduler/Operational -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'vitals' } | Format-List TimeCreated, Id, Message
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe' OR Name = 'powershell.exe'" |
            Format-List ProcessId, ParentProcessId, SessionId, CommandLine
          $log = "$env:LOCALAPPDATA\vitals\logs\vitals.log"
          if (Test-Path $log) { 'vitals.log:'; Get-Content -Tail 50 $log } else { 'no vitals.log' }
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run service:uninstall
      - name: store and credential kept
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          if (-not ((Get-Item "$env:LOCALAPPDATA\vitals\vitals.db").Length -gt 0)) { exit 1 }
          if (-not ((Get-Item "$env:LOCALAPPDATA\vitals\token").Length -gt 0)) { exit 1 }

  # NB-774: the real systemd user unit on a real Linux host, end to end, with
  # the README's "Linux (systemd)" commands in the same order. The unit tests
  # stub systemctl; this job is where the unit itself is proven.
  linux-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: user manager with lingering
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 20); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: seed the store from the demo
        run: |
          npm run demo -- --no-serve
          mkdir -p "$HOME/.local/state/vitals"
          cp "$(node -p 'require("os").tmpdir()')/vitals-demo/demo.db" "$HOME/.local/state/vitals/vitals.db"
      - run: npm run token:mint
      - run: npm run service:install
      - run: npm run service:verify
      - name: first delivery
        run: |
          curl -fsS -H "x-vitals-token: $(cat "$HOME/.config/vitals/token")" \
            -H 'content-type: application/json' \
            --data-binary @tests/fixtures/worked-example.json http://127.0.0.1:4781/ingest
          npm run deliveries
      - name: logs
        if: always()
        run: journalctl --user -u vitals.service --no-pager | tail -n 50
      - run: npm run service:uninstall
      - name: store and credential kept
        run: test -s "$HOME/.local/state/vitals/vitals.db" && test -s "$HOME/.config/vitals/token"

